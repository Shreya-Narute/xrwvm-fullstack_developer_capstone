
name: Full Stack Capstone CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  django-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install flask nltk

      - name: Run Django system checks and migrations
        run: |
          cd server
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Verify Car models seeding
        run: |
          cd server
          python -c "import django, os; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'djangoproj.settings'); django.setup(); from djangoapp.populate import initiate; initiate(); from djangoapp.models import CarMake, CarModel; assert CarMake.objects.count() >= 5; assert CarModel.objects.count() >= 15"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Install Frontend dependencies
        run: |
          cd server/frontend
          npm ci

      - name: Build React Application
        run: |
          cd server/frontend
          npm run build

  express-database-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Install Express dependencies
        run: |
          cd server/database
          npm install

      - name: Syntax and Model Check
        run: |
          cd server/database
          node -c app.js
          node -c dealership.js
          node -c review.js
          node -c inventory.js
